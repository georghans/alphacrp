services:
  web:
    image: sellpy-web-local
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "50m"
        max-file: "5"
    env_file:
      - ./.env.prod.local
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    image: sellpy-worker-local
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "50m"
        max-file: "5"
    env_file:
      - ./.env.prod.local
    volumes:
      - worker_data:/data

  migrate:
    image: sellpy-worker-local
    profiles:
      - migrate
    env_file:
      - ./.env.prod.local
    working_dir: /app/apps/sellpy-scraper
    command: ["npm", "run", "migrate"]
    logging:
      driver: local
      options:
        max-size: "50m"
        max-file: "5"

  alloy:
    image: grafana/alloy:v1.5.1
    restart: unless-stopped
    user: root
    command:
      - run
      - /etc/alloy/config.alloy
      - --stability.level=generally-available
    volumes:
      - ./alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - alloy_data:/var/lib/alloy
    environment:
      HOST_PROC: /host/proc
      HOST_SYS: /host/sys
      HOST_ROOT: /rootfs
      GRAFANA_LOKI_URL: ${GRAFANA_LOKI_URL}
      GRAFANA_LOKI_USERNAME: ${GRAFANA_LOKI_USERNAME}
      GRAFANA_PROMETHEUS_URL: ${GRAFANA_PROMETHEUS_URL}
      GRAFANA_PROMETHEUS_USERNAME: ${GRAFANA_PROMETHEUS_USERNAME}
      GRAFANA_LOKI_API_KEY: ${GRAFANA_LOKI_API_KEY}
      GRAFANA_PROMETHEUS_API_KEY: ${GRAFANA_PROMETHEUS_API_KEY}
      HOSTNAME: ${HOSTNAME}
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    command:
      - --housekeeping_interval=60s
      - --docker_only=true
      - --disable_metrics=advtcp,cpu_topology,cpuset,hugetlb,memory_numa,process,referenced_memory,resctrl,sched,tcp,udp
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    expose:
      - "8080"
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  worker_data:
  alloy_data:
