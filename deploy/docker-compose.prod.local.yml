services:
  web:
    image: sellpy-web-local
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "50m"
        max-file: "5"
    env_file:
      - ./.env.prod.local
    ports:
      - "3000:3000"

  worker:
    image: sellpy-worker-local
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "50m"
        max-file: "5"
    env_file:
      - ./.env.prod.local
    volumes:
      - worker_data:/data

  migrate:
    image: sellpy-worker-local
    profiles:
      - migrate
    env_file:
      - ./.env.prod.local
    working_dir: /app/apps/sellpy-scraper
    command: ["npm", "run", "migrate"]
    logging:
      driver: local
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  worker_data:
